services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - wallet_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "127.0.0.1:8091:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://wallet:${POSTGRES_PASSWORD}@db:5432/wallet
      ALLOWED_ORIGINS: http://localhost:8091,http://127.0.0.1:8091
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  wallet_postgres:
